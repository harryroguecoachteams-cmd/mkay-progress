<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Our Year Together</title>
<link rel="icon" href="https://travelwithmkay.co.ke/wp-content/uploads/2023/05/cropped-TWMK_favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EE;--card:#fff;--ink:#14213D;--ink2:#4A5468;--muted:#6E7689;--line:#E6DED3;--navy:#001F78;--bar:#2B4BA8;--bar2:#B9C6EA;--accent:#B84E1E;--good:#1E7A4C;--soft:#F1ECE5;--gold:#FFC15E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1424;--card:#151F35;--ink:#EEF1F7;--ink2:#B7C0D3;--muted:#8D97AB;--line:#26324D;--navy:#9DB4FF;--bar:#7F9CF5;--bar2:#34457A;--accent:#F08A5D;--good:#5CC795;--soft:#1A2540}}
:root[data-theme="dark"]{--bg:#0D1424;--card:#151F35;--ink:#EEF1F7;--ink2:#B7C0D3;--muted:#8D97AB;--line:#26324D;--navy:#9DB4FF;--bar:#7F9CF5;--bar2:#34457A;--accent:#F08A5D;--good:#5CC795;--soft:#1A2540}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lato,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--navy);margin:0;font-weight:700}
a{color:var(--navy)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
#lock{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,rgba(0,20,70,.25),rgba(0,20,70,.65)),url(login-bg.webp) center 35%/cover no-repeat #0A2342}
.lockbox{background:#fff;color:#14213D;border-radius:18px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox img{width:56px;height:56px;border-radius:12px}
.lockbox h1{font-size:28px;margin:12px 0 20px;color:#001F78}
.lockbox input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #D9D2C7;border-radius:10px;background:#F7F3EE;color:#14213D}
.lockbox input:focus{outline:none;border-color:#001F78}
.lockbox button{font:inherit;cursor:pointer;margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:#001F78;color:#fff;font-weight:700}
.err{color:#C0392B;font-size:14px;min-height:20px;margin-top:8px}
#app{display:none}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.back{font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card);color:var(--navy)}
.brand{font-size:13px;color:var(--muted)}
.hero{background:#001F78;color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:16px}
.hero .kick{color:var(--gold);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{color:#fff;font-size:clamp(30px,5vw,46px);line-height:1.1;margin:6px 0 10px}
.hero p{margin:0;color:#D6DDF2;max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tile .v{font-size:32px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:14px;color:var(--ink2);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.card > h2{font-size:25px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:12px Lato,sans-serif;fill:var(--muted)}
.chart .val{fill:var(--ink2);font-weight:700}
.chart .b{fill:var(--bar2)} .chart .b.hi{fill:var(--bar)} .chart .pace{fill:none;stroke:var(--bar);stroke-width:1.5;stroke-dasharray:4 4}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.legend .lb{background:var(--bar2)} .legend .lhi{background:var(--bar)} .legend .lp{border:1.5px dashed var(--bar)}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl > li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
ol.tl > li:first-child{border-top:0;padding-top:4px}
.when{font-weight:900;color:var(--accent);font-size:14px;padding-top:3px}
ol.tl h3{font-size:19px;margin-bottom:4px}
ol.tl ul,.areas ul,.next ul{margin:0;padding-left:20px}
ol.tl ul li,.areas li,.next li{margin:5px 0;color:var(--ink2)}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.area{background:var(--soft);border-radius:12px;padding:16px}
.area h3{font-size:18px;margin-bottom:6px}
.next{border:2px solid var(--accent);border-left-width:8px}
.next li{color:var(--ink)}
a.go{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;text-decoration:none;color:var(--bg);background:var(--accent);border-radius:999px;padding:8px 18px}
.so{font-size:12px;color:var(--muted)}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:26px}.areas{grid-template-columns:1fr}ol.tl > li{grid-template-columns:1fr;gap:4px}.card{padding:16px}.hero{padding:24px 18px}.chart text{font-size:24px}}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="f">
    <img src="https://travelwithmkay.co.ke/wp-content/uploads/2023/05/cropped-TWMK_favicon-192x192.png" alt="">
    <h1>Our year together</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button type="submit" id="go">Open</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" class="wrap">
  <div class="bar-top"><a class="back" href="index.html">Back to your dashboard</a><span class="brand">Travel with Mkay</span></div>
  <div id="content"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const store = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const e = await (await fetch('recap.enc.json', {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct))));
}
async function unlock(pw){
  $('#go').textContent = 'Opening...';
  let d;
  try { d = await decrypt(pw); } catch(x){ $('#err').textContent = 'That password did not work. Please try again.'; $('#go').textContent = 'Open'; return; }
  store.set('mk_pw', pw); $('#lock').style.display = 'none'; $('#app').style.display = 'block'; $('#content').innerHTML = d.html;
}
$('#f').addEventListener('submit', e => { e.preventDefault(); unlock($('#pw').value); });
const saved = store.get('mk_pw'); if (saved) unlock(saved);
</script>
</body>
</html>
